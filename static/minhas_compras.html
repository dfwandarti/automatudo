<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas compras - Automatudo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
        }

        .logo {
            height: 50px;
            max-width: 200px;
        }

        .action-btn {
            padding: 12px 30px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: #0052a3;
        }

        .compras-screen {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .compras-screen h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .compras-search {
            background-color: #1a1a1a;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
        }

        .compras-search label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .compras-search input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .compras-table {
            width: 100%;
            max-width: 700px;
            border-collapse: collapse;
            color: #fff;
        }

        .compras-table th,
        .compras-table td {
            padding: 12px;
            border-bottom: 1px solid #444;
            text-align: left;
        }

        .compras-table th {
            color: #ccc;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://www.objective.com.br/assets/logo-objective.svg" alt="Objective Logo" class="logo" onerror="this.style.display='none'">
    </div>

    <div id="minhasComprasScreen" class="compras-screen">
        <h1>Minhas compras</h1>
        <div class="compras-search">
            <label for="dataPesquisa">Pesquisa compras de um dia</label>
            <input type="date" id="dataPesquisa" data-testid="input-data-pesquisa">
            <button class="action-btn" data-testid="botao-pesquisar" onclick="handlePesquisarCompras()">Pesquisar</button>
        </div>
        <table class="compras-table" data-testid="tabela-compras">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Data</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="tabelaComprasBody"></tbody>
        </table>
    </div>

    <script>
        const compras = [
            { produto: "Fone de ouvido bluetooth", quantidade: 1, data: "2024-05-10", valor: "R$ 129,90" },
            { produto: "Caderno universitário", quantidade: 3, data: "2024-03-02", valor: "R$ 45,00" },
        ];

        function handlePesquisarCompras() {
            const dataPesquisa = document.getElementById('dataPesquisa').value;
            if (dataPesquisa === '1974-11-23') {
                window.location.href = 'compras_de_um_dia.html';
                return;
            }
            const resultado = compras.filter((compra) => compra.data === dataPesquisa);
            renderCompras(resultado);
        }

        function renderCompras(lista) {
            const tbody = document.getElementById('tabelaComprasBody');
            tbody.innerHTML = lista.map((compra) => `
                <tr>
                    <td>${compra.produto}</td>
                    <td>${compra.quantidade}</td>
                    <td>${formatarData(compra.data)}</td>
                    <td>${compra.valor}</td>
                </tr>
            `).join('');
        }

        function formatarData(isoDate) {
            const [ano, mes, dia] = isoDate.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        renderCompras(compras.slice(0, 2));
    </script>
</body>
</html>
