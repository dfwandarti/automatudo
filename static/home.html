<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Automatudo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
        }

        .logo {
            height: 50px;
            max-width: 200px;
        }

        .home-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            flex-direction: column;
            text-align: center;
        }

        .home-screen h1 {
            color: #fff;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .welcome-message {
            color: #00cc66;
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .home-actions {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            padding: 12px 30px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://www.objective.com.br/assets/logo-objective.svg" alt="Objective Logo" class="logo" onerror="this.style.display='none'">
    </div>

    <div id="homeScreen" class="home-screen">
        <h1>Home</h1>
        <div class="welcome-message" id="welcomeMessage" data-testid="mensagem-sucesso"></div>
        <div class="home-actions">
            <button class="action-btn" data-testid="botao-minha-conta">Minha conta</button>
            <button class="action-btn" data-testid="botao-minhas-compras" onclick="window.location.href='minhas_compras.html'">Minhas compras</button>
        </div>
    </div>

    <script>
        const usuario = new URLSearchParams(window.location.search).get('usuario') || '';
        document.getElementById('welcomeMessage').textContent = `Bem vindo senhor ${usuario}`;
    </script>
</body>
</html>
